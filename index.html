<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student cards</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            padding: 40px 0;
        }
  .frame {
            border: 3px solid black;
            width: 85%;
            margin: auto;
            padding: 40px 20px;
            background: white;
        }
</head>
<body>
        .cards {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }
 .card {
            width: 230px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 20px 20px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.15);
            position: relative;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: #007bff;
            border-radius: 50%;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
  h3 {
            margin-top: 25px;
            margin-bottom: 8px;
            font-size: 18px;
        }

        p {
            margin: 4px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="frame">
        <div class="cards">

            <!-- Card 1 -->
            <div class="card">
                <div class="avatar">JK</div>
                <h3>Jeet Kumar</h3>
                <p>B.Tech - CSE</p>
                <p>Roll No: 21CS1007</p>
                <p>1st Year</p>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <div class="avatar">AR</div>
                <h3>Asha Rani</h3>
                <p>B.Tech - IT</p>
                <p>Roll No: 21IT1012</p>
                <p>1st Year</p>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <div class="avatar">RK</div>
                <h3>Rohit Kumar</h3>
                <p>B.Tech - ECE</p>
                <p>Roll No: 21EC1009</p>
                <p>1st Year</p>
            </div>

        </div>
    </div>

</body>
</html>
</body>
</html>
